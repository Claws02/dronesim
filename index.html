<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Drone Setup Guide</title>
<!-- Fonts are optional: the guide works fully offline and falls back to system fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e13; --panel:#11171e; --panel2:#171f28; --line:#232e3b; --line2:#2f3d4e;
  --text:#e6edf3; --muted:#8a97a7; --accent:#ffb020; --accent-ink:#1a1200;
  --ok:#3fb950; --warn:#e3a008; --danger:#ff5b5b; --info:#58a6ff; --video:#c084fc;
  --radius:10px; --shadow:0 8px 30px rgba(0,0,0,.35);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme=light]{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#d8dfe7; --line2:#c4cfdb;
  --text:#15202b; --muted:#5a6878; --accent:#c26d00; --accent-ink:#fff;
  --ok:#1f8a3a; --warn:#a86b00; --danger:#d12f2f; --info:#1f6fd1; --video:#8b3fd9;
  --shadow:0 8px 30px rgba(20,30,40,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--info)}
button{font:inherit;color:inherit}
code,kbd{font-family:var(--mono);font-size:.88em;background:var(--panel2);border:1px solid var(--line);padding:.05em .4em;border-radius:5px}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}
pre code{background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;flex:none;color:var(--accent)}
.brand .t{font-weight:700;letter-spacing:.2px;white-space:nowrap;line-height:1.1}
.brand .s{font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.prog{display:flex;align-items:center;gap:8px;flex:1;min-width:90px;max-width:260px}
.prog .bar{flex:1;height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffd166);transition:width .4s}
.prog span{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.search{position:relative;flex:1;max-width:280px}
.search input{width:100%;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:14px}
.qres{position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;z-index:40}
.qres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.qres button:hover,.qres button:focus{background:var(--panel2)}
.qres small{display:block;color:var(--muted);font-size:12px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:14px;white-space:nowrap}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.pill.demo .dot{background:var(--video)}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:17px;flex:none}
.menu{position:absolute;right:12px;top:56px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:260px;z-index:50}
.menu button,.menu a{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--text);text-decoration:none;font-size:14px}
.menu button:hover,.menu a:hover{background:var(--panel2)}
.menu .mobile-only{display:none}
.only-mobile{display:none}
.ribbon{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--warn) 18%,var(--panel)),color-mix(in srgb,var(--warn) 18%,var(--panel)) 12px,var(--panel) 12px,var(--panel) 24px);border-bottom:1px solid var(--line);padding:6px 16px;font-size:13px;text-align:center}
.editbar{background:color-mix(in srgb,var(--info) 14%,var(--panel));border-bottom:1px solid var(--line);padding:10px 16px;font-size:13px}
.editbar ul{margin:6px 0 0;padding-left:18px;color:var(--danger)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.phase{margin-bottom:6px}
.phase-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 8px;cursor:pointer;border-radius:8px;text-align:left}
.phase-h:hover{background:var(--panel2)}
.phase-h .ic{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:14px;flex:none}
.phase-h .nm{flex:1;font-weight:600;font-size:14px}
.phase-h .ct{font:11px var(--mono);color:var(--muted)}
.phase.complete .phase-h .ic{background:color-mix(in srgb,var(--ok) 22%,var(--panel2));border-color:var(--ok)}
.steps-l{list-style:none;margin:2px 0 8px;padding:0 0 0 20px;border-left:1px dashed var(--line2);margin-left:20px}
.steps-l button{display:flex;gap:8px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--muted);line-height:1.35}
.steps-l button:hover{background:var(--panel2);color:var(--text)}
.steps-l button.cur{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text);font-weight:600}
.steps-l .st{width:16px;flex:none;font-family:var(--mono);text-align:center}
.st.done{color:var(--ok)} .st.skipped{color:var(--warn)}
.main{padding:28px clamp(16px,4vw,56px) 80px;max-width:980px;width:100%;min-width:0;outline:none}

/* ---------- step ---------- */
.crumbs{font:12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:6px 0 10px;letter-spacing:-.3px}
h3{margin:18px 0 6px;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.meta span{font:12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.meta .lvl.easy{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.meta .lvl.medium{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.meta .lvl.hard{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.meta .eid{color:var(--info);border-color:var(--info)}
.phase-intro{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0 8px}
.phase-intro .pi{font-size:26px;line-height:1}
.phase-intro p{margin:0}
.verify{background:color-mix(in srgb,var(--info) 12%,var(--panel));border:1px dashed var(--info);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:16px 0}
.content p{margin:0 0 12px}
.content ul,.content ol{margin:0 0 12px;padding-left:22px}
.content li{margin:3px 0}
.content .note{font-size:14px;color:var(--muted);border-left:3px solid var(--line2);padding-left:10px}
.content table{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:14px}
.content th,.content td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.content th{background:var(--panel2);font-weight:600}
.alert{display:flex;gap:12px;border-radius:var(--radius);padding:12px 14px;margin:10px 0;border:1px solid;font-size:15px}
.alert .ai{font-size:18px;line-height:1.3}
.alert p{margin:0}
.alert.danger{background:color-mix(in srgb,var(--danger) 12%,var(--panel));border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.alert.caution{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.alert.tip{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.alert.info{background:color-mix(in srgb,var(--info) 10%,var(--panel));border-color:color-mix(in srgb,var(--info) 45%,var(--line))}
.alert b.lv{font:600 11px var(--mono);letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:2px}
.media{display:grid;gap:12px;margin:16px 0;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.media figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.media img,.media video{display:block;width:100%;height:auto;cursor:zoom-in;background:#000}
.media iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.media figcaption{font-size:13px;color:var(--muted);padding:8px 12px}
.ph{aspect-ratio:16/10;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:13px;background:repeating-linear-gradient(-45deg,var(--panel),var(--panel) 10px,var(--panel2) 10px,var(--panel2) 20px)}
.ph b{display:block;font-size:26px;margin-bottom:6px;opacity:.7}
details.more{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:16px 0}
details.more>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'＋';font-family:var(--mono);color:var(--accent);width:16px}
details.more[open]>summary::before{content:'−'}
details.more>.content{padding:0 18px 8px}
.sec-h{font:600 12px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .15s,background .15s}
.chk:hover{border-color:var(--line2)}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk .box{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;margin-top:1px;transition:.15s}
.chk.on{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:color-mix(in srgb,var(--ok) 7%,var(--panel))}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on .box::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.chk .txt{flex:1}
.badge{font:600 10px var(--mono);letter-spacing:.6px;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.badge.live{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok);border:1px solid var(--ok)}
.trouble details{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:6px 0}
.trouble summary{cursor:pointer;padding:10px 14px;font-weight:500}
.trouble .content{padding:0 16px 6px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:14px;border:1px solid var(--line2);border-radius:99px;padding:4px 12px;text-decoration:none;background:var(--panel)}
textarea.note-in{width:100%;min-height:70px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:14px var(--sans);resize:vertical}
.foot{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;margin-top:28px;padding:12px 0;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -10px 20px -12px rgba(0,0,0,.25)}
.grow{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:600;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{background:var(--panel2);color:var(--muted);border-color:var(--line2);opacity:1}
.btn.link{background:none;border:0;color:var(--muted);font-weight:500;text-decoration:underline}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.term{border:0;background:none;padding:0;color:inherit;border-bottom:1.5px dotted var(--accent);cursor:help;font:inherit}
.pop{position:absolute;z-index:60;max-width:320px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;font-size:14px}
.pop b{display:block;margin-bottom:4px;color:var(--accent)}
.gate{border:2px solid var(--danger);border-radius:14px;padding:20px 22px;background:color-mix(in srgb,var(--danger) 8%,var(--panel));margin:16px 0}
.gate h2{margin:0 0 8px;font-size:20px}
.gate .chk{margin:14px 0}

/* ---------- modal / lightbox ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--bg);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);width:min(860px,100%);max-height:92vh;overflow:auto;padding:20px 22px}
.modal .box h2{margin:0 0 4px}
.modal img{max-width:100%;max-height:88vh;border-radius:10px}
.modal .x{float:right}

/* ---------- live widgets ---------- */
.lw{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:16px 0;overflow:hidden}
.lw-h{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel2);font:600 12px var(--mono);letter-spacing:.6px;text-transform:uppercase}
.lw-h .d{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.lw.fresh .lw-h .d{background:var(--ok)}
.lw.demo .lw-h .d{background:var(--video)}
.lw-h .src{margin-left:auto;color:var(--muted);font-weight:400}
.lw-b{padding:14px}
.lw-wait{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv small{display:block;font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kv b{font:600 17px var(--mono)}
.good{color:var(--ok)} .bad{color:var(--danger)} .meh{color:var(--warn)}
.chbars{display:grid;gap:6px}
.chbar{display:grid;grid-template-columns:70px 1fr 54px;gap:10px;align-items:center;font:12px var(--mono)}
.chbar .tr{height:12px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;position:relative;overflow:hidden}
.chbar .tr i{position:absolute;top:0;bottom:0;left:0;background:var(--info);border-radius:99px}
.chbar .tr::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.msgs{font:12.5px var(--mono);max-height:180px;overflow:auto;display:grid;gap:3px}
.msgs .sev0,.msgs .sev1,.msgs .sev2,.msgs .sev3{color:var(--danger)} .msgs .sev4{color:var(--warn)}
.live-modal .row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}

/* ---------- diagrams ---------- */
.dg{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:16px 0;padding:14px}
.dg svg{display:block;width:100%;height:auto;max-height:440px}
.dg-title{font:600 12px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.dg-info{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:14px;min-height:44px}
.dg-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.dg .legend{display:flex;gap:14px;flex-wrap:wrap;font:12px var(--mono);color:var(--muted);margin-top:8px}
.dg .legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
svg .arm{stroke:var(--line2);stroke-width:10;stroke-linecap:round}
svg .body{fill:var(--panel2);stroke:var(--line2);stroke-width:2}
svg .motor{cursor:pointer}
svg .propdisc{fill:color-mix(in srgb,var(--info) 8%,transparent);stroke:var(--line2);stroke-width:1.5;stroke-dasharray:4 4;transition:.2s}
svg .propdisc.CW{fill:color-mix(in srgb,var(--accent) 9%,transparent)}
svg .motor.hl .propdisc,svg .motor:hover .propdisc,svg .motor:focus .propdisc{stroke:var(--accent);stroke-width:3;stroke-dasharray:none;fill:color-mix(in srgb,var(--accent) 22%,transparent)}
svg .hub{fill:var(--panel);stroke:var(--text);stroke-width:2}
svg .num{fill:var(--text);font:700 15px var(--mono);text-anchor:middle;dominant-baseline:central}
svg .rot{fill:none;stroke-width:3;stroke-linecap:round}
svg .rot.CW,svg .head.CW{stroke:var(--accent);fill:none} svg .head.CW{fill:var(--accent)}
svg .rot.CCW,svg .head.CCW{stroke:var(--info);fill:none} svg .head.CCW{fill:var(--info)}
svg .dirlbl{font:600 11px var(--mono);text-anchor:middle;fill:var(--muted)}
svg .front{fill:var(--accent);font:700 12px var(--mono);text-anchor:middle;letter-spacing:2px}
.spin{animation:spin 2.2s linear infinite}
.spin.CCW{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
svg .comp rect{fill:var(--panel2);stroke:var(--line2);stroke-width:1.5;rx:8}
svg .comp text{fill:var(--text);font:600 12px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .comp{cursor:pointer}
svg .comp.hl rect{stroke:var(--accent);stroke-width:3}
svg .comp.fc rect{fill:color-mix(in srgb,var(--accent) 12%,var(--panel2));stroke:var(--accent)}
svg .wire{stroke-width:3;fill:none;opacity:.55;transition:.2s}
svg .wire.power{stroke:var(--danger)} svg .wire.signal{stroke:var(--info)} svg .wire.video{stroke:var(--video)} svg .wire.data{stroke:var(--ok)}
svg .wire.hl{opacity:1;stroke-width:5}
svg .wire.dim{opacity:.12}
svg .wlbl{font:11px var(--mono);fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4}
svg .wlbl.hl{fill:var(--text)}
.vtx{overflow:auto}
.vtx table{border-collapse:separate;border-spacing:4px;font:13px var(--mono);margin:0 auto}
.vtx th{color:var(--muted);font-weight:600;padding:4px 6px}
.vtx td button{width:100%;min-width:56px;padding:8px 4px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font:13px var(--mono)}
.vtx td button:hover{border-color:var(--accent)}
.vtx td button.rec{border-color:var(--ok)}
.vtx td button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.vtx td button.same{outline:2px dashed var(--warn);outline-offset:-3px}
.vtx-read{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.vtx-read .big{font:700 30px var(--mono);color:var(--accent)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.part{background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px;position:relative}
.part.pick{transition:border-color .15s,box-shadow .15s}
.part .pbtn{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit}
.part .pimg{display:block;position:relative}
.part .pbadge{position:absolute;left:8px;bottom:8px;font:600 11px var(--mono);padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff}
.part:not(.pick) .pbadge{display:none}
.part.pick:hover{border-color:var(--line2)}
.part.on{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 40%,transparent)}
.part.on .pbadge{background:var(--ok)}
.part.on .pimg::after{content:'✓';position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.part.miss{border-color:var(--danger)}
.part.miss .pbadge{background:var(--danger)}
.part.miss .pimg{opacity:.55}
.part .pmiss{position:absolute;top:6px;left:6px;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;opacity:.9}
.part.miss .pmiss{color:var(--danger);border-color:var(--danger)}
.pgroup{font:600 12px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.copybox{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:14px 16px;margin:14px 0}
.cb-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cb-fields{margin:12px 0}
.cb-fields select{height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:15px var(--sans)}
.cb-text{white-space:pre-wrap;font-size:12.5px;max-height:320px;margin:0}
.part .ph,.part img{aspect-ratio:4/3;width:100%;object-fit:cover;display:grid}
.part .pt{padding:8px 10px}
.part .q{font:600 12px var(--mono);color:var(--accent)}
.part small{color:var(--muted);display:block;line-height:1.35;margin-top:2px}
.sticks{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.gimbal{text-align:center;font:12px var(--mono);color:var(--muted)}
.gimbal svg{width:170px;height:170px}
svg .gbox{fill:var(--panel2);stroke:var(--line2);stroke-width:2}
svg .gx{stroke:var(--line2);stroke-dasharray:3 4}
svg .gdot{fill:var(--accent);stroke:var(--bg);stroke-width:3;transition:cx .08s linear,cy .08s linear}
svg .glbl{fill:var(--muted);font:10.5px var(--mono);text-anchor:middle}
.horizon{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.horizon svg{width:180px;height:180px;flex:none}
.done-hero{text-align:center;padding:30px 10px}
.done-hero .big{font-size:64px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.fields label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fields input{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:15px var(--sans)}
#report{display:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .search{display:none} .menu .mobile-only{display:block} }
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .prog{position:absolute;left:0;right:0;bottom:-1px;max-width:none;min-width:0}
  .prog .bar{height:3px;border:0;border-radius:0}
  .brand .t{font-size:15px}
  .side{position:fixed;top:60px;left:0;bottom:0;width:min(330px,88vw);z-index:25;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow);height:auto}
  body.nav-open .side{transform:none}
  .only-mobile{display:block}
  .seg,.prog span{display:none}
  .brand .s{display:none}
  .pill .lbl{display:none}
  .pill{padding:0 11px}
  .main{padding-top:20px}
  .foot .btn{padding:10px 12px;font-size:14px;white-space:nowrap}
  .foot{gap:6px}
}

/* ---------- print report ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff;color:#000;font-size:11pt}
  #app,.modal,.pop{display:none!important}
  #report{display:block;padding:0 3px}
  #report h1{font-size:20pt;margin:0 0 4px}
  #report .sub{color:#444;margin-bottom:14px}
  #report table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:9.5pt;table-layout:fixed}
  #report td{overflow-wrap:anywhere}
  #report .w-n{width:6%} #report .w-p{width:17%} #report .w-s{width:31%} #report .w-st{width:11%} #report .w-c{width:15%}
  #report th,#report td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  #report th{background:#eee}
  #report tr{page-break-inside:avoid}
  #report .cert{border:3px double #000;padding:18px;text-align:center;margin:10px 0 18px}
  #report .cert h2{margin:0 0 6px;font-size:18pt}
  #report .sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
  #report .sign div{border-top:1px solid #000;padding-top:4px;font-size:9pt}
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="report"></div>

<!--

<script>
const GUIDE = {

  meta: {
    id: "px4-quad-setup",            // change for a new guide (keeps saved progress separate)
    title: "Drone Setup Guide",
    drone: "[Your drone / kit name]",
    organization: "[Your team or company]",
    support: "[support email, phone or link]",
    version: "0.1.0",
    updated: "2026-11-19",
    placeholder: true                // shows the "template content" ribbon. Set false when real materials are in.
  },

  settings: {
    requireChecks: true,             // Next is locked until every box on a step is ticked
    allowSkip: true,                 // show "Skip for now" (skipped steps are flagged in the report)
    stickMode: 2,                    // 1 or 2 — which stick does throttle (Mode 2 = left)
    rcMap: { roll: 1, pitch: 2, throttle: 3, yaw: 4 },  // RC channel order (AETR)
    cells: 4,                        // LiPo cell count, used for per-cell voltage readouts
    // 3D assembly animations (diagram type "assembly3d"). Loaded only when a step needs them.
    // Files are relative to index.html. Offline model wrappers come from tools/glb-to-js.mjs or Assembly Studio.
    models: ["models/placeholder-quad.js"],
    partGroups: { part: "Drone parts", tool: "Tools (included in the box)" }
  },

  // ───────────────────────── PARTS LIST ─────────────────────────
  // image: "" shows a placeholder. Use a relative path ("img/motor.jpg") or a URL.
  parts: [
    { id: "frame",   name: "Frame kit (arms, plates, standoffs)", qty: 1, image: "", note: "Includes frame screws." },
    { id: "motors",  name: "Brushless motors",            qty: 4, image: "", note: "Check the KV rating matches your battery." },
    { id: "esc",     name: "4-in-1 ESC (or 4 single ESCs)", qty: 1, image: "", note: "Drives the motors." },
    { id: "pm",      name: "Power module",                qty: 1, image: "", note: "Measures battery voltage and current for PX4." },
    { id: "fc",      name: "PX4 flight controller",       qty: 1, image: "", note: "Pixhawk-style board." },
    { id: "gps",     name: "GPS + compass module",        qty: 1, image: "", note: "With mast or mount." },
    { id: "rx",      name: "ExpressLRS receiver",         qty: 1, image: "", note: "With antenna." },
    { id: "tx",      name: "ExpressLRS radio transmitter", qty: 1, image: "", note: "The handheld controller." },
    { id: "cam",     name: "Analog FPV camera",           qty: 1, image: "", note: "" },
    { id: "vtx",     name: "Analog video transmitter (VTX) + antenna", qty: 1, image: "", note: "5.8 GHz." },
    { id: "goggles", name: "Analog FPV goggles + antenna", qty: 1, image: "", note: "Must be 5.8 GHz analog." },
    { id: "props",   name: "Propellers (2 CW + 2 CCW, plus spares)", qty: 8, image: "", note: "" },
    { id: "lipo",    name: "LiPo flight batteries",       qty: 2, image: "", note: "Match the cell count in settings." },
    { id: "charger", name: "LiPo balance charger",        qty: 1, image: "", note: "" },
    { id: "strap",   name: "Battery strap + grip pad",    qty: 1, image: "", note: "" },
    { id: "usb",     name: "USB data cable",              qty: 1, image: "", note: "Must carry data, not just charge." },
    { id: "hw",      name: "Hardware bag (screws, zip ties, heat-shrink, foam tape)", qty: 1, image: "", note: "" },
    // group: "tool" puts the item under "Tools (included in the box)"
    { id: "hex",     group: "tool", name: "Hex driver set (1.5 / 2.0 / 2.5 mm)", qty: 1, image: "", note: "" },
    { id: "meter",   group: "tool", name: "Multimeter",                  qty: 1, image: "", note: "For checking for short circuits." },
    { id: "cutters", group: "tool", name: "Side cutters",                qty: 1, image: "", note: "" },
    { id: "iron",    group: "tool", name: "Soldering iron + solder",     qty: 1, image: "", note: "" },
    { id: "smoke",   group: "tool", name: "Smoke stopper",               qty: 1, image: "", note: "Protects the electronics on first power-up." }
  ],

  // ───────────────────────── GLOSSARY ─────────────────────────
  // Write [[term]] in any text to make a tap-to-explain word. Use [[key|shown text]] for a different label.
  glossary: {
    "PX4": "Open-source flight software that runs on the flight controller and keeps the drone stable.",
    "QGroundControl": "Free desktop/mobile app used to install PX4, calibrate sensors and change settings. Often shortened to QGC.",
    "QGC": "Short for QGroundControl, the setup app.",
    "flight controller": "The drone's brain: a small circuit board with sensors and a processor running PX4.",
    "FC": "Flight controller: the drone's brain.",
    "ESC": "Electronic Speed Controller. Turns battery power into the 3-phase power that spins each motor.",
    "power module": "Sits between the battery and the drone. Powers the flight controller and tells it battery voltage/current.",
    "ELRS": "ExpressLRS: an open-source radio control link between your handheld radio and the drone.",
    "CRSF": "Crossfire serial protocol. The digital language an ELRS receiver uses to send stick positions to the flight controller.",
    "bind phrase": "A secret word you type into both the radio and the receiver so they only talk to each other.",
    "receiver": "The small radio on the drone that picks up commands from your handheld transmitter.",
    "transmitter": "The handheld radio controller with the sticks.",
    "UART": "A serial port on the flight controller. TX on one device connects to RX on the other.",
    "VTX": "Video transmitter. Sends the camera picture to your goggles over 5.8 GHz.",
    "FPV": "First-Person View: flying while watching live video from the drone's camera.",
    "band": "A group of 8 video channels (A, B, E, F, R). The VTX and goggles must use the same band and channel.",
    "mW": "Milliwatts: how strong the video signal is. Use low power (25 mW) on the bench.",
    "LiPo": "Lithium-polymer battery. Very powerful; can catch fire if punctured, over-charged or over-discharged.",
    "XT60": "The common yellow plug used for flight batteries.",
    "arming": "Switching the motors on. Once armed, the props can spin at any moment.",
    "failsafe": "What the drone does automatically when something goes wrong, e.g. losing radio signal.",
    "airframe": "The type of vehicle (quad X, hexa, plane…) you tell PX4 you are flying.",
    "actuator": "Anything PX4 controls: motors, servos. Configured on the Actuators screen.",
    "CW": "Clockwise rotation, as seen from above.",
    "CCW": "Counter-clockwise rotation, as seen from above.",
    "DShot": "A digital protocol between the flight controller and the ESCs. Allows reversing motor direction in software.",
    "compass": "Magnetometer. Tells the drone which way it is pointing. Sensitive to nearby metal and power wires.",
    "RSSI": "Received Signal Strength Indicator: how good the radio link is.",
    "Remote ID": "A digital licence plate that broadcasts the drone's identity and location, required in many countries.",
    "smoke stopper": "A fuse-like device used on first power-up that limits current, so a wiring short doesn't burn parts."
  },

  // ───────────────────────── PHASES & STEPS ─────────────────────────
  phases: [

    /* ============ 1. BEFORE YOU START ============ */
    {
      id: "start", title: "Before you start", icon: "🧭",
      summary: "Get set up: how this guide works, safety, parts and software.",
      steps: [
        {
          id: "welcome", title: "Welcome — how this guide works", time: "2 min", level: "easy",
          body: [
            "This guide takes you from a box of parts to a drone that's ready to fly. Do one step at a time.",
            [
              "**Tick every box** on a step to unlock the next one.",
              "Tap any word with a dotted underline, like [[ESC]], to see what it means.",
              "Switch between **Simple** and **Detailed** at the top. Detailed opens the extra notes on every step.",
              "Your progress **saves automatically** in this browser. Close the tab and come back any time.",
              "Stuck? Every step has a **Stuck?** section with common fixes."
            ],
            "Using Chrome or Edge on a computer? You can **connect the drone over USB** and this guide will check some steps for you. Look for the green **LIVE** badges."
          ],
          details: [
            "Need help from a person? Contact: {{support}}.",
            {note: "This guide is a single file. It works offline, and nothing you enter leaves your computer."}
          ],
          checks: ["I know my progress saves in this browser, on this device"]
        },
        {
          id: "safety", title: "Read the safety rules", time: "3 min", level: "easy",
          gate: {
            title: "Safety first",
            text: [
              "Drone motors spin at more than 20,000 RPM. A spinning prop can cause serious cuts, and LiPo batteries can catch fire.",
              "Read these rules before you continue."
            ],
            confirm: "I understand that props and batteries can cause injury and fire"
          },
          warnings: [
            { level: "danger", text: "**Props stay OFF** until the last phase of this guide. Never work on a drone with props on and a battery connected." },
            { level: "danger", text: "**Never charge LiPo batteries unattended.** Charge them on a fire-safe surface or in a LiPo bag." }
          ],
          body: [
            [
              "Unplug the battery whenever you are not actively testing.",
              "Never power the video transmitter without its antenna attached. It can burn itself out.",
              "Throw away (properly recycle) any battery that is puffy, dented or damaged.",
              "Work in a clear, well-lit space, and keep kids and pets away.",
              "Fly only where it's legal and safe. Covered in the last phase."
            ]
          ],
          details: [
            {h: "LiPo basics"},
            [
              "Charge only with a balance charger set to the correct cell count and chemistry (LiPo).",
              "Land when the battery reaches about 3.5 V per cell. Going lower damages it.",
              "Store batteries at about 3.8 V per cell (most chargers have a *Storage* mode)."
            ]
          ],
          checks: [
            "Props will stay off until I'm told to put them on",
            "I have a fire-safe place to charge batteries",
            "I will unplug the battery whenever I'm not testing"
          ]
        },
        {
          id: "parts", title: "Check what's in the box", time: "10 min", level: "easy",
          body: [
            "Lay everything out on a clear table. All the tools you need are in the box too.",
            "**Tap each photo when you find that item.** If something isn't there, tap **Missing?** on it."
          ],
          diagram: { type: "parts" },
          checklistFrom: "parts",
          verify: "Replace with the kit's real packing list and a photo of every item (image paths).",
          troubleshoot: [
            { q: "Something is missing", a: "Stop here and contact {{support}} before you build. Missing small hardware is often in a bag taped inside the frame box." }
          ]
        },
        {
          id: "qgc-install", title: "Request QGroundControl from IT", time: "5 min + IT wait", level: "easy",
          body: [
            "You'll need **[[QGroundControl]]** on your computer in Phase 3. Company computers are managed by IT, so **ask IT to install it**.",
            {ol: [
              "Fill in the boxes below. The ticket text updates as you type.",
              "Press **Copy ticket**.",
              "Paste it into a new IT ticket and submit it **today**. Approval can take a few days."
            ]},
            {copy: {
              id: "qgc-ticket",
              label: "IT ticket: QGroundControl install",
              fields: [
                { key: "name",    label: "Your name" },
                { key: "team",    label: "Team / department" },
                { key: "asset",   label: "Computer asset tag or name" },
                { key: "os",      label: "Operating system", options: ["Windows", "macOS", "Linux"] },
                { key: "manager", label: "Manager / approver" },
                { key: "date",    label: "Needed by (date)" }
              ],
              text: [
                "Subject: Software install request: QGroundControl (drone setup software)",
                "",
                "Requester: {{f.name}}",
                "Team / department: {{f.team}}",
                "Computer: {{f.asset}} ({{f.os}})",
                "Manager / approver: {{f.manager}}",
                "Needed by: {{f.date}}",
                "",
                "SOFTWARE REQUESTED",
                "- Name: QGroundControl (QGC), latest stable release",
                "- Publisher: Dronecode Project (open source)",
                "- License: open source (Apache 2.0 / GPLv3), no cost",
                "- Official download: https://docs.qgroundcontrol.com/master/en/qgc-user-guide/getting_started/download_and_install.html",
                "",
                "BUSINESS JUSTIFICATION",
                "Needed to install firmware on, configure and calibrate the {{drone}} drone (PX4 flight controller) as part of its setup procedure.",
                "",
                "TECHNICAL NOTES FOR IT",
                "- Connects to the drone's flight controller over USB (shows up as a USB serial / COM port). The user needs access to USB serial devices.",
                "- Uses the internet to download PX4 firmware and optional map tiles.",
                "- Windows: no extra driver is normally needed for PX4 boards.",
                "- Linux: the user must be in the 'dialout' group, and ModemManager should be removed (it interferes with the serial port)."
              ]
            }},
            "While you wait for IT: put your flight batteries on the balance charger."
          ],
          details: "Already have admin rights and your company allows it? You can install QGroundControl yourself from the official download page linked below.",
          links: [{ label: "QGroundControl download & install", url: "https://docs.qgroundcontrol.com/master/en/qgc-user-guide/getting_started/download_and_install.html" }],
          verify: "IT TICKET: rewrite for this organisation. Use its ticket system's required fields, the IT contact or portal, whether QGC is in the approved software catalogue, and the asset-tag format. Keep it copy/paste friendly. Re-check the license and download URL.",
          checks: [
            "I submitted the IT ticket",
            "QGroundControl is installed and opens on my computer",
            "Batteries are charging (balance mode, correct cell count)"
          ]
        }
      ]
    },

    /* ============ 2. BUILD ============ */
    {
      id: "build", title: "Build the drone", icon: "🔧",
      summary: "Put the frame together, mount the motors and electronics, and wire it up.",
      steps: [
        {
          id: "frame", title: "Assemble the frame", time: "20 min", level: "easy",
          media: [{ type: "image", src: "", caption: "Frame fully assembled, top view" }],
          diagram: { type: "assembly3d", model: "placeholder-quad",
            show: ["frame_*", "arm_*", "standoff_*"],
            steps: [
              { label: "Lay the bottom plate flat", parts: "frame_bottom", from: "down", distance: 40 },
              { label: "Slide the four arms into place", parts: "arm_*", from: "out", stagger: 0.15 },
              { label: "Screw in the standoffs", parts: "standoff_*", from: "up", distance: 50, spin: { axis: "y", turns: 2 }, stagger: 0.1 },
              { label: "Add the top plate", parts: "frame_top", from: "up", distance: 60 }
            ] },
          body: {ol: [
            "Find the bottom plate and the four arms.",
            "Attach the arms to the bottom plate with the supplied screws. Don't fully tighten them yet.",
            "Fit the standoffs.",
            "Check every arm sits flat and square, then tighten all screws."
          ]},
          details: "Use a small drop of medium (blue) threadlocker on metal-into-metal screws. Never use it on plastic, which it can crack.",
          checks: ["All four arms are attached and tight", "The frame sits flat on the table without rocking"]
        },
        {
          id: "motors", title: "Mount the motors", time: "15 min", level: "medium",
          warnings: [
            { level: "caution", text: "**Screws that are too long can touch the motor windings** and short the motor. Check that the screw doesn't touch the copper inside before you tighten it." }
          ],
          body: [
            "Mount one motor at the end of each arm, with the wires pointing toward the centre of the frame.",
            "Motor positions are numbered. This is how [[PX4]] numbers them on a quad in an X layout. You'll use these numbers later:"
          ],
          diagrams: [
            { type: "assembly3d", model: "placeholder-quad",
              show: ["frame_*", "arm_*", "standoff_*"],
              labels: { motor1: "Motor 1", motor2: "Motor 2", motor3: "Motor 3", motor4: "Motor 4" },
              steps: [
                { label: "Motor 1 goes on the front-right arm", parts: "motor1", from: "up", rotate: [0, 90, 0], callout: true },
                { label: "Then motors 2, 3 and 4", parts: ["motor2", "motor3", "motor4"], from: "up", rotate: [0, 90, 0], stagger: 0.4, callout: true }
              ] },
            { type: "quadX", mode: "motors" }
          ],
          details: "Don't worry about which way each motor spins yet. You'll check and fix direction in software in Phase 7.",
          checks: ["All four motors are mounted with wires toward the centre", "No screw touches the motor windings", "Each motor spins freely by hand"]
        },

  sticks(o) { return { html: widgetBox('sticks', o) }; },

  /* What's in the box. On a step with checklistFrom:"parts" every photo IS the checkbox (tap = found, "Missing?" = flag it). */
  parts() {

  },

  /* 3D assembly animation, loaded on demand (assembly3d.js + vendor/three.bundle.js + GUIDE.settings.models) */
  assembly3d(o) {

    return { html: `<div class="a3d-host" id="${id}" style="margin:16px 0"><div class="dg" style="height:${(o.height || 380) + 120}px;display:grid;place-items:center;color:var(--muted)">Loading 3D animation…</div></div>`,
      mount(root) {

        }).catch(err => {
          el.innerHTML = `<div class="dg" style="color:var(--muted)">🧊 The 3D animation couldn't load: ${esc(err.message || err)}<br><small>The 3D files (<code>assembly3d.js</code>, <code>vendor/</code>, <code>models/</code>) must sit next to this guide file. The written instructions still work without them.</small></div>`;
        });
      } };
  }
};

function partsHTML() {
  const s = IDX[S.current], interactive = s && s.checklistFrom === 'parts', x = s ? st(s.id) : { checks: {}, missing: {} };
  const groups = SET.partGroups || { part: 'Parts', tool: 'Tools' }, all = GUIDE.parts || [];
  const keys = [...new Set(all.map(p => p.group || 'part'))];
  const found = all.filter(p => x.checks['part-' + p.id]).length, missing = all.filter(p => (x.missing || {})['part-' + p.id]);
  const card = p => {
    const key = 'part-' + p.id, on = !!x.checks[key], miss = !!(x.missing || {})[key];
    const img = p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : `<div class="ph"><span><b>📦</b>Photo: ${esc(p.name)}</span></div>`;
    const inner = `<span class="pimg">${img}<span class="pbadge">${on ? '✓ Found' : miss ? '✕ Missing' : 'Tap if you have it'}</span></span><span class="pt"><span class="q">×${p.qty}</span> ${esc(p.name)}${p.note ? `<small>${inline(p.note)}</small>` : ''}</span>`;
    if (!interactive) return `<div class="part">${inner}</div>`;
    return `<div class="part pick ${on ? 'on' : ''} ${miss ? 'miss' : ''}"><button type="button" class="pbtn" data-act="part" data-key="${key}" aria-pressed="${on}" aria-label="${esc(p.name)}: ${on ? 'found' : 'not found yet'}">${inner}</button>
      <button type="button" class="pmiss" data-act="missing" data-key="${key}">${miss ? 'Undo missing' : 'Missing?'}</button></div>`;
  };
  return `<div class="dg-title">What's in the box${interactive ? ` · <span class="${found === all.length ? 'good' : ''}">${found} of ${all.length} found</span>` : ''}</div>
    ${missing.length ? `<div class="alert danger"><span class="ai">⛔</span><div><b class="lv">Missing items</b><p>${missing.map(p => esc(p.name)).join(', ')}. Contact ${esc(META.support || 'your instructor')} before you start building.</p></div></div>` : ''}
    ${keys.map(k => `${keys.length > 1 ? `<h3 class="pgroup">${esc(groups[k] || k)}</h3>` : ''}<div class="parts">${all.filter(p => (p.group || 'part') === k).map(card).join('')}</div>`).join('')}`;
}

let load3DPromise = null;
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error(`missing file "${src}"`)); document.head.appendChild(el); });
}
function load3D() {
  if (window.Assembly3D) return Promise.resolve();
  if (!load3DPromise) {
    const base = SET.assetsBase || '';
    load3DPromise = (window.THREE ? Promise.resolve() : loadScript(base + 'vendor/three.bundle.js'))
      .then(() => loadScript(base + 'assembly3d.js'))
      .then(() => Promise.all((SET.models || []).map(m => loadScript(base + m))))
      .catch(e => { load3DPromise = null; throw e; });
  }
  return load3DPromise;
}

/* ---------------------------------------------------------------- validation (editor mode) */
const ISSUES = [];
(() => {
  const seen = new Set();
  if (!STEPS.length) ISSUES.push('No steps defined.');
  STEPS.forEach(s => {
    const where = `Step "${s.title || '?'}" (${s._phase.title})`;
    if (!s.id) ISSUES.push(`${where} has no id.`); else if (seen.has(s.id)) ISSUES.push(`Duplicate step id "${s.id}".`); else seen.add(s.id);
    diagramsOf(s).forEach(dg => {
      if (!DIAGRAMS[dg.type]) ISSUES.push(`${where}: unknown diagram type "${dg.type}".`);
      if (dg.type === 'assembly3d') {
        if (!dg.model) ISSUES.push(`${where}: assembly3d needs a "model".`);
        (dg.steps || []).forEach((a, i) => { if (!a.parts && !a.camera && a.action !== 'wait') ISSUES.push(`${where}: assembly3d step ${i + 1} has no "parts".`); });
      }
    });
    (s.live || []).forEach(w => { if (!WIDGETS[w]) ISSUES.push(`${where}: unknown live panel "${w}".`); });
    normChecks(s).forEach(c => { if (c.auto && !AUTO[c.auto]) ISSUES.push(`${where}: unknown auto check "${c.auto}".`); });
    if (!normChecks(s).length) ISSUES.push(`${where} has no checks. Readers can continue without confirming anything.`);
  });
  // Pre-render all text so missing glossary terms are collected
  STEPS.forEach(s => { rich(s.body); rich(s.details); (s.warnings || []).forEach(w => inline(w.text)); normChecks(s).forEach(c => inline(c.text)); (s.troubleshoot || []).forEach(t => rich(t.a)); });
  MISSING_TERMS.forEach(t => ISSUES.push(`Glossary term [[${t}]] is used but not defined in GUIDE.glossary.`));
})();

function stepHTML(s) {
  const p = s._phase, gated = s.gate && !S.acks[s.id];
  let h = `<div class="crumbs">Phase ${s._pi + 1}/${PHASES.length} · ${esc(p.title)} · Step ${s._si + 1}/${p.steps.length}</div>`;
  if (s._si === 0 && p.summary) h += `<div class="phase-intro"><span class="pi">${esc(p.icon || '')}</span><div>${rich(p.summary)}</div></div>`;
  h += `<h1>${esc(s.title)}</h1><div class="meta">${s.time ? `<span>⏱ ${esc(s.time)}</span>` : ''}${s.level ? `<span class="lvl ${esc(s.level)}">${esc(s.level)}</span>` : ''}${EDIT ? `<span class="eid">#${esc(s.id)}</span>` : ''}</div>`;
  if (EDIT && s.verify) h += `<div class="verify">⚑ <b>VERIFY:</b> ${inline(s.verify)}</div>`;
  if (gated) {
    return h + `<div class="gate"><h2>⚠ ${esc(s.gate.title || 'Before you continue')}</h2><div class="content">${rich(s.gate.text)}</div>
      <label class="chk" id="gatechk"><input type="checkbox" data-act="gatebox"><span class="box"></span><span class="txt">${inline(s.gate.confirm || 'I understand')}</span></label>
      <button class="btn primary" data-act="ack" id="ackbtn" disabled>Continue to this step</button></div>${footHTML(s)}`;
  }
  const order = { danger: 0, caution: 1, info: 2, tip: 3 }, icons = { danger: '⛔', caution: '⚠️', info: 'ℹ️', tip: '💡' }, names = { danger: 'Danger', caution: 'Caution', info: 'Note', tip: 'Tip' };
  (s.warnings || []).slice().sort((a, b) => (order[a.level] ?? 9) - (order[b.level] ?? 9)).forEach(w => {
    const lv = order[w.level] !== undefined ? w.level : 'info';
    h += `<div class="alert ${lv}" role="${lv === 'danger' ? 'alert' : 'note'}"><span class="ai">${icons[lv]}</span><div><b class="lv">${names[lv]}</b>${rich(w.text)}</div></div>`;
  });
  if (s.media && s.media.length) h += `<div class="media">${s.media.map(mediaHTML).join('')}</div>`;
  h += `<div class="content">${rich(s.body)}</div>`;
  diagramsOf(s).forEach(dg => { if (!DIAGRAMS[dg.type]) return; const d = DIAGRAMS[dg.type](dg); h += `<div class="dg-wrap">${d.html}</div>`; mountQueue.push(d.mount); });
  (s.live || []).forEach(w => h += widgetBox(w, {}));
  if (s.details) h += `<details class="more" ${S.detail === 'detailed' ? 'open' : ''}><summary>More detail</summary><div class="content">${rich(s.details)}</div></details>`;
  const checks = normChecks(s);
  if (checks.length) h += `<div class="sec-h chk-h">✔ Confirm before moving on</div><ul class="checks" id="checks"></ul>`;
  if (s.troubleshoot && s.troubleshoot.length) h += `<div class="sec-h">🛟 Stuck?</div><div class="trouble">${s.troubleshoot.map(t => `<details><summary>${inline(t.q)}</summary><div class="content">${rich(t.a)}</div></details>`).join('')}</div>`;
  if (s.links && s.links.length) h += `<div class="sec-h">🔗 Links</div><div class="links">${s.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div>`;
  h += `<div class="sec-h">📝 My notes</div><textarea class="note-in" data-act="note" placeholder="Anything worth remembering. Notes appear in your printed report.">${esc(st(s.id).note || '')}</textarea>`;
  return h + footHTML(s);
}
function mediaHTML(m) {
  const cap = m.caption ? `<figcaption>${inline(m.caption)}</figcaption>` : '';
  if (!m.src) return `<figure><div class="ph"><span><b>${m.type === 'video' ? '🎬' : '📷'}</b>${esc(m.type === 'video' ? 'Video' : 'Photo')} goes here${m.caption ? ':<br>' + esc(m.caption) : ''}</span></div></figure>`;
  if (m.type === 'video') {
    const yt = m.src.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
    if (yt) return `<figure><iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}" title="${esc(m.caption || 'video')}" allowfullscreen loading="lazy"></iframe>${cap}</figure>`;
    return `<figure><video src="${esc(m.src)}" controls preload="metadata"></video>${cap}</figure>`;
  }
  return `<figure><img src="${esc(m.src)}" alt="${esc(m.alt || m.caption || '')}" loading="lazy" data-act="zoom">${cap}</figure>`;
}
function footHTML(s) {

    ${SET.allowSkip && !(s.gate && !S.acks[s.id]) ? `<button class="btn link" data-act="skip">Skip for now</button>` : ''}<button class="btn primary" data-act="next" id="nextbtn"></button></div>`;
}
function renderChecks(s) {
  const ul = $('#checks'); if (!ul) return;
  const list = normChecks(s).filter(c => !(s.checklistFrom === 'parts' && c.key.startsWith('part-')));
  ul.closest('.main').querySelector('.sec-h.chk-h')?.toggleAttribute('hidden', !list.length);
  ul.innerHTML = list.map(c => { const on = isTicked(s, c);
    return `<li><label class="chk ${on ? 'on' : ''}"><input type="checkbox" data-act="check" data-c="${esc(c.key)}" ${on ? 'checked' : ''}><span class="box"></span><span class="txt">${inline(c.text)}${c.auto ? ` <span class="badge live" title="Ticks itself when a drone is connected over USB">LIVE</span>` : ''}</span></label></li>`; }).join('');
}
function updateFoot(s) {
  const b = $('#nextbtn'); if (!b) return;
  const left = remaining(s), last = s._idx === STEPS.length - 1, gated = s.gate && !S.acks[s.id];
  const locked = gated || (SET.requireChecks && left > 0);
  b.disabled = locked;
  b.textContent = gated ? 'Confirm the safety notice first' : locked ? `${left} left to confirm` : last ? 'Finish 🏁' : (left ? 'Next step →' : 'Done. Next step →');
}

let mountQueue = [];
function renderMain(keepScroll) {
  const main = $('#main'), y = window.scrollY; mountQueue = [];

}

/* ---------------------------------------------------------------- navigation */
function go(id, keepScroll) {
  if (id !== '__done' && !IDX[id]) return;
  S.current = id; save(); document.body.classList.remove('nav-open');

  renderSide(); updateTop(); renderMain(keepScroll);
}
function next() {
  const s = IDX[S.current]; if (!s) return;
  if (SET.requireChecks && remaining(s) > 0) return;
  const x = st(s.id); x.status = 'done'; x.at = new Date().toISOString(); save();
  go(s._idx < STEPS.length - 1 ? STEPS[s._idx + 1].id : '__done');
}

      <tr><th>Started</th><td>${fmtTime(S.started)}</td><th>Printed</th><td>${fmtTime(now.toISOString())}</td></tr>
      <tr><th>Progress</th><td>${d} / ${STEPS.length} steps</td><th>Live link</th><td>${S.liveSeen ? `${esc(S.liveSeen.autopilot)} · ${esc(S.liveSeen.type)} (first seen ${fmtTime(S.liveSeen.at)})` : 'Not used'}</td></tr>
      ${(() => { const m = (S.steps.parts || {}).missing || {}; const names = (GUIDE.parts || []).filter(p => m['part-' + p.id]).map(p => esc(p.name)); return names.length ? `<tr><th>Missing parts</th><td colspan="3">${names.join(', ')}</td></tr>` : ''; })()}
      <tr><th>Video channel</th><td>${S.prefs.vtx ? esc(tokens('{{vtx}}')) : '—'}</td><th>Safety notices</th><td>${Object.keys(S.acks).length} acknowledged</td></tr></table>
    <table><thead><tr><th class="w-n">#</th><th class="w-p">Phase</th><th class="w-s">Step</th><th class="w-st">Status</th><th class="w-c">Completed</th><th>Notes</th></tr></thead><tbody>
    ${STEPS.map(s => { const x = S.steps[s.id] || {}; return `<tr><td>${s._pi + 1}.${s._si + 1}</td><td>${esc(s._phase.title)}</td><td>${esc(s.title)}</td><td>${label(x.status)}</td><td>${x.at ? fmtTime(x.at) : ''}</td><td>${esc(x.note || '')}</td></tr>`; }).join('')}</tbody></table>
    <div class="sign"><div>Builder signature / date</div><div>Reviewer / instructor signature / date</div></div>`;
}
window.addEventListener('beforeprint', buildReport);

/* ---------------------------------------------------------------- search */
const SEARCH = STEPS.map(s => ({ s, text: [s.title, flat(s.body), flat(s.details), flat(s.troubleshoot), flat(s.checks), s._phase.title].join(' ').toLowerCase() }));
function doSearch(q) {
  const box = $('#qres'); q = q.trim().toLowerCase();
  if (!q) { box.hidden = true; return; }
  const terms = q.split(/\s+/), hits = SEARCH.filter(x => terms.every(t => x.text.includes(t))).slice(0, 8);
  box.innerHTML = hits.length ? hits.map(x => `<button data-act="go" data-id="${esc(x.s.id)}">${esc(x.s.title)}<small>${esc(x.s._phase.title)}</small></button>`).join('') : '<button disabled>No matching steps</button>';
  box.hidden = false;
}

/* ---------------------------------------------------------------- events */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!e.target.closest('.term')) $('#pop').hidden = true;
  if (!e.target.closest('#menu') && !e.target.closest('[data-act="menu"]')) $('#menu').hidden = true;
  if (!e.target.closest('.search')) $('#qres').hidden = true;
  if (e.target.id === 'modal') closeModal();
  if (!t) return;
  const act = t.dataset.act, s = IDX[S.current];
  switch (act) {
    case 'go': e.preventDefault(); $('#q').value = ''; go(t.dataset.id); break;
    case 'next': next(); break;
    case 'prev': if (s && s._idx > 0) go(STEPS[s._idx - 1].id); break;
    case 'skip': if (s) { const x = st(s.id); if (x.status !== 'done') x.status = 'skipped'; save(); go(s._idx < STEPS.length - 1 ? STEPS[s._idx + 1].id : '__done'); } break;
    case 'ack': if (s) { S.acks[s.id] = new Date().toISOString(); save(); renderMain(true); } break;
    case 'detail': S.detail = t.dataset.v; save(); shell(); render(); break;
    case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme; save(); break;
    case 'menu': $('#menu').hidden = !$('#menu').hidden; break;
    case 'nav': document.body.classList.toggle('nav-open'); break;
    case 'live': $('#menu').hidden = true; openLive(); break;
    case 'connect': connectSerial(); break;
    case 'demo': startDemo(); break;
    case 'disconnect': disconnect(); break;
    case 'close': closeModal(); break;
    case 'part': case 'missing': {
      if (!s) break; const x = st(s.id); x.missing = x.missing || {}; const k = t.dataset.key;
      if (act === 'part') { x.checks[k] = !x.checks[k]; if (x.checks[k]) delete x.missing[k]; }
      else { x.missing[k] = !x.missing[k]; if (x.missing[k]) x.checks[k] = false; }
      if (!x.checks[k] && x.status === 'done') { x.status = 'todo'; renderSide(); updateTop(); }
      save(); $('#partsdg').innerHTML = partsHTML(); updateFoot(s); break;
    }
    case 'copy': {
      const c = COPY[t.dataset.id]; if (!c) break; const txt = copyText(c);
      const done = () => { t.textContent = 'Copied ✓'; setTimeout(() => t.textContent = 'Copy ticket', 1800); };
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (er) { alert('Select the text and copy it manually.'); } ta.remove(); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
      break;
    }
    case 'term': e.preventDefault(); showTerm(t); break;
    case 'zoom': modal(`<div style="text-align:center"><img src="${esc(t.getAttribute('src'))}" alt=""></div>`); $('#modal .box').style.width = 'auto'; break;
    case 'print': $('#menu').hidden = true; buildReport(); window.print(); break;
    case 'reset': if (confirm('Erase all progress, ticks and notes for this guide on this device?')) { localStorage.removeItem(KEY); S = defaults(); shell(); render(); } break;
    case 'export': {
      const blob = new Blob([JSON.stringify({ guide: META.id, version: META.version, state: S }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${META.id || 'guide'}-progress.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); break;
    }
    case 'import': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(txt => { try { const j = JSON.parse(txt); if (j.guide && j.guide !== META.id && !confirm('This file is from a different guide. Load anyway?')) return; S = Object.assign(defaults(), j.state || j); save(); shell(); render(); } catch (err) { alert('That file could not be read.'); } }); };
      inp.click(); break;
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'check') {
    const s = IDX[S.current]; if (!s) return; const x = st(s.id);
    x.checks[t.dataset.c] = t.checked; if (!t.checked && x.status === 'done') { x.status = 'todo'; renderSide(); updateTop(); }
    t.closest('.chk').classList.toggle('on', t.checked); save(); updateFoot(s);
  } else if (t.dataset.act === 'gatebox') {
    t.closest('.chk').classList.toggle('on', t.checked); $('#ackbtn').disabled = !t.checked;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act === 'note') { st(S.current).note = t.value; save(); }
  else if (t.dataset.act === 'builder') { S.builder[t.dataset.k] = t.value; save(); }
  else if (t.id === 'q') doSearch(t.value);
  else if (t.dataset.act === 'cbfield') {
    S.prefs.fields = S.prefs.fields || {}; S.prefs.fields[t.dataset.k] = t.value; save();
    const box = t.closest('.copybox'); $('.cb-text', box).textContent = copyText(COPY[box.dataset.copy]);
  }
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === 'Escape') { closeModal(); $('#pop').hidden = true; $('#menu').hidden = true; $('#qres').hidden = true; document.body.classList.remove('nav-open'); }
  if (typing) { if (e.key === 'Enter' && e.target.id === 'q') { const b = $('#qres button[data-id]'); if (b) b.click(); } return; }
  if (e.key === '/') { e.preventDefault(); const q = $('#q'); if (q && q.offsetParent) q.focus(); }
});
window.addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && id !== S.current && (IDX[id] || id === '__done')) go(id); });

/* ---------------------------------------------------------------- boot */
const hashId = decodeURIComponent(location.hash.slice(1));
if (hashId && (IDX[hashId] || hashId === '__done')) S.current = hashId;
if (!IDX[S.current] && S.current !== '__done') S.current = STEPS[0] && STEPS[0].id;
shell(); render();
if (EDIT && ISSUES.length) console.warn('[guide] content issues:\n' + ISSUES.join('\n'));

/* small debug/test hook */
window.DroneGuide = { GUIDE, STEPS, state: () => S, live: LIVE, feed, crcAcc, issues: ISSUES, startDemo, disconnect };
})();
</script>
</body>
